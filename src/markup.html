<div class="app" id="app">
  <header class="head">
    <div class="head-top">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <defs><linearGradient id="ppBrandGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent-2)"/><stop offset="1" stop-color="var(--accent)"/></linearGradient></defs>
          <rect width="24" height="24" rx="6.5" fill="url(#ppBrandGrad)"/>
          <path d="M6.5 7.25h11M6.5 12h7.5M6.5 16.75h4" stroke="#fff" stroke-width="2.1" stroke-linecap="round"/>
          <path d="M13.6 14.6v4.3" stroke="#fff" stroke-width="1.7" stroke-linecap="round" opacity=".85"/>
        </svg>
        <span class="brand-name" translate="no">Plainpad</span>
      </div>
      <nav class="menubar" id="menubar" aria-label="Main menu"></nav>
    </div>
    <div class="tools" role="toolbar" aria-label="Toolbar">
      <button class="tool" data-act="newTab" title="New tab" aria-label="New tab"><svg viewBox="0 0 20 20"><path class="f" d="M5.5 2.5h6l4 4v11h-10z"/><path d="M11.5 2.5v4h4 M10.5 9.5v5 M8 12h5"/></svg></button>
      <button class="tool" data-act="openFile" title="Open file" aria-label="Open file"><svg viewBox="0 0 20 20"><path d="M2.5 15.5v-10a1 1 0 0 1 1-1h4l1.5 1.5h6a1 1 0 0 1 1 1V9"/><path class="f" d="M2.5 15.5l2.1-5.3a1 1 0 0 1 .93-.63H18l-2.2 5.6a1 1 0 0 1-.93.63H2.5z"/></svg></button>
      <button class="tool" data-act="save" title="Save" aria-label="Save"><svg viewBox="0 0 20 20"><path class="f" d="M3.5 4.5a1 1 0 0 1 1-1h8.6l3.4 3.4v8.6a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/><path d="M6.5 3.5v3.5h5.5V3.5 M6 16.5v-4.5h8v4.5"/></svg></button>
      <button class="tool" data-act="saveAll" title="Save All" aria-label="Save All"><svg viewBox="0 0 20 20"><path class="f" d="M3.5 7.5a1 1 0 0 1 1-1h6.6l2.4 2.4v6.6a1 1 0 0 1-1 1h-8a1 1 0 0 1-1-1z"/><path d="M6 6.5v2.5h4V6.5 M5.5 16.5v-3.5h6v3.5 M6.5 3.5h7.1l2.9 2.9v7.1"/></svg></button>
      <button class="tool" data-act="closeActive" title="Close Tab" aria-label="Close Tab"><svg viewBox="0 0 20 20"><path class="f" d="M5.5 2.5h6l4 4v11h-10z"/><path d="M11.5 2.5v4h4 M8.5 10.5l4 4 M12.5 10.5l-4 4"/></svg></button>
      <span class="tool-sep"></span>
      <button class="tool" data-act="undo" title="Undo" aria-label="Undo"><svg viewBox="0 0 20 20"><path d="M7 5.5 3.5 9 7 12.5 M3.5 9h8.5a4 4 0 0 1 0 8H10"/></svg></button>
      <button class="tool" data-act="redo" title="Redo" aria-label="Redo"><svg viewBox="0 0 20 20"><path d="M13 5.5 16.5 9 13 12.5 M16.5 9H8a4 4 0 0 0 0 8h2"/></svg></button>
      <span class="tool-sep"></span>
      <button class="tool" data-act="find" title="Find" aria-label="Find"><svg viewBox="0 0 20 20"><circle class="f" cx="9" cy="9" r="5.5"/><path d="m13 13 4.5 4.5"/></svg></button>
      <button class="tool" data-act="replace" title="Replace" aria-label="Replace"><svg viewBox="0 0 20 20"><path d="M3 6.5h11 M11 3.5l3 3-3 3 M17 13.5H6 M9 10.5l-3 3 3 3"/></svg></button>
      <button class="tool" data-act="findInFiles" title="Find in files" aria-label="Find in files"><svg viewBox="0 0 20 20"><path d="M2.5 15.5v-10a1 1 0 0 1 1-1h4l1.5 1.5h6a1 1 0 0 1 1 1V9 M2.5 15.5a1 1 0 0 0 1 1H8"/><circle class="f" cx="13.5" cy="13" r="3"/><path d="m15.7 15.2 2.3 2.3"/></svg></button>
      <span class="tool-sep"></span>
      <button class="tool" data-act="toggleWrap" id="tWrap" title="Word Wrap" aria-label="Word Wrap" aria-pressed="false"><svg viewBox="0 0 20 20"><path d="M3 5h14 M3 10h10a2.5 2.5 0 0 1 0 5h-2.5 M12.3 12.7 10.5 15l1.8 2.3 M3 15h4"/></svg></button>
      <button class="tool" data-act="toggleWs" id="tWs" title="Show Whitespace and Line Endings" aria-label="Show Whitespace and Line Endings" aria-pressed="false"><svg viewBox="0 0 20 20"><path class="f" d="M11 3.5H9.5a3.5 3.5 0 0 0 0 7H11z"/><path d="M11 3.5v13 M14.5 3.5v13 M16 3.5h-5"/></svg></button>
      <button class="tool" data-act="zoomIn" title="Zoom In" aria-label="Zoom In"><svg viewBox="0 0 20 20"><circle class="f" cx="9" cy="9" r="5.5"/><path d="m13 13 4.5 4.5 M6.5 9h5 M9 6.5v5"/></svg></button>
      <button class="tool" data-act="zoomOut" title="Zoom Out" aria-label="Zoom Out"><svg viewBox="0 0 20 20"><circle class="f" cx="9" cy="9" r="5.5"/><path d="m13 13 4.5 4.5 M6.5 9h5"/></svg></button>
      <span class="tool-sep"></span>
      <button class="tool" data-act="bmToggle" title="Toggle Bookmark" aria-label="Toggle Bookmark"><svg viewBox="0 0 20 20"><path class="f" d="M5.5 3.5h9a.5.5 0 0 1 .5.5v12.5l-5-3.2-5 3.2V4a.5.5 0 0 1 .5-.5z"/></svg></button>
      <button class="tool" data-act="macroRec" id="tRec" title="Start recording macro" aria-label="Start recording macro" aria-pressed="false"><svg viewBox="0 0 20 20"><circle class="f" cx="10" cy="10" r="6.5"/><circle cx="10" cy="10" r="3" fill="currentColor" stroke="none"/></svg></button>
      <button class="tool" data-act="macroPlay" title="Play macro" aria-label="Play macro"><svg viewBox="0 0 20 20"><path class="f" d="M6.5 4.5v11l9-5.5z"/></svg></button>
      <button class="tool" data-act="macroMulti" title="Run Macro Multiple Times" aria-label="Run Macro Multiple Times"><svg viewBox="0 0 20 20"><path class="f" d="M3.5 5v10l6.5-5z M10 5v10l6.5-5z"/></svg></button>
      <span class="tool-sep"></span>
      <button class="tool" data-act="toggleSplit" id="tSplit" title="Split View" aria-label="Split View" aria-pressed="false"><svg viewBox="0 0 20 20"><path class="f" d="M3.5 4.5h13a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1z"/><path d="M10 4.5v11"/></svg></button>
      <button class="tool" data-act="toggleSync" id="tSync" title="Sync Scrolling" aria-label="Sync Scrolling" aria-pressed="false"><svg viewBox="0 0 20 20"><path d="M6 3.5v13 M3 6.5l3-3 3 3 M14 16.5v-13 M11 13.5l3 3 3-3"/></svg></button>
      <button class="tool" data-act="compare" id="tCmp" title="Compare two tabs" aria-label="Compare two tabs" aria-pressed="false"><svg viewBox="0 0 20 20"><path class="f" d="M2.5 4.5h6v11h-6z M11.5 4.5h6v11h-6z"/><path d="M4.5 8h2 M13.5 8h2 M4.5 11h2 M13.5 11.5h2 M14.5 10.5v2"/></svg></button>
      <button class="tool" data-act="mdPreview" id="tMd" title="Markdown Preview" aria-label="Markdown Preview" aria-pressed="false"><svg viewBox="0 0 20 20"><path class="f" d="M2.5 5.5a1 1 0 0 1 1-1h13a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1z"/><path d="M5 12.5v-5l2.25 2.5L9.5 7.5v5 M13.5 7.5v5 M11.5 10.5l2 2 2-2"/></svg></button>
      <button class="tool" data-act="toggleHex" id="tHex" title="Hex view" aria-label="Hex view" aria-pressed="false"><svg viewBox="0 0 20 20"><path class="f" d="M10 2.5l6.5 3.75v7.5L10 17.5l-6.5-3.75v-7.5z"/><path d="M7.5 7.5v5 M7.5 10h5 M12.5 7.5v5"/></svg></button>
      <span class="tool-sep"></span>
      <button class="tool" data-act="cycleTheme" title="Switch theme" aria-label="Switch theme"><svg viewBox="0 0 20 20"><circle class="f" cx="10" cy="10" r="6.5"/><path d="M10 3.5a6.5 6.5 0 0 1 0 13z" fill="currentColor" stroke="none"/></svg></button>
    </div>
  </header>

  <div class="banner" id="banner" role="status" hidden><span id="bannerText"></span><button class="btn" id="bannerReload" type="button">Reload</button></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Open files"></div>

  <main class="paper" id="paper">
    <section class="pane is-focus" id="pane1" aria-label="Main view">
      <div class="pane-head" id="p1Head" hidden><span>Main view</span><span class="pane-name" id="p1Name"></span></div>
      <div class="ed" id="editor"></div>
      <div class="hexwrap" id="hexWrap" hidden>
        <div class="hexbar">
          <label>Row <select id="hxCols" aria-label="Bytes per row"><option value="8">8</option><option value="16" selected>16</option><option value="32">32</option></select></label>
          <label>Text column <select id="hxEnc" aria-label="Text Column Encoding"></select></label>
          <button class="mini" id="hxIns" aria-pressed="false" title="Switch insert / overwrite mode (Insert key)">Overwrite</button>
          <input type="text" id="hxFind" spellcheck="false" autocomplete="off" placeholder="Search hex: 4D 5A ?? 00" aria-label="Search">
          <div class="seg" id="hxFindMode" role="group" aria-label="Search type"><button data-m="hex" aria-pressed="true" translate="no">Hex</button><button data-m="text" aria-pressed="false">Text</button></div>
          <button class="chip" id="hxCase" aria-pressed="false" translate="no" title="Match case" hidden>Aa</button>
          <button class="mini" id="hxPrev" title="Previous" aria-label="Previous">↑</button>
          <button class="mini" id="hxNext" title="Next" aria-label="Next">↓</button>
          <span class="find-info" id="hxInfo" aria-live="polite"></span>
          <span class="grow"></span>
          <button class="mini" id="hxGoto">Go to Offset…</button>
          <button class="mini" id="hxInspBtn" aria-pressed="true">Data Inspector</button>
          <button class="mini" id="hxText">View as Text</button>
        </div>
        <div class="hexmain">
          <div class="hexview col-hex" id="hexView">
            <div class="hexscroll" id="hexScroll"><div class="hexcontent" id="hexContent"><div class="hexhead" id="hexHead"></div><div class="hexbody" id="hexBody"><div class="hexrows" id="hexRows"></div></div></div></div>
            <textarea class="hexinput" id="hexInput" aria-label="Hex editor" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
          </div>
          <aside class="hexinsp" id="hexInsp" aria-label="Data Inspector">
            <div class="insp-head"><strong>Data Inspector</strong><div class="seg" id="hxEndian" role="group" aria-label="Byte order"><button data-le="1" aria-pressed="true" title="Little-endian">LE</button><button data-le="0" aria-pressed="false" title="Big-endian">BE</button></div></div>
            <dl class="insp" id="hexInspBody"></dl>
          </aside>
        </div>
      </div>
    </section>
    <section class="pane" id="pane2" hidden aria-label="Second view">
      <div class="pane-head">
        <span>Second view</span>
        <select id="p2Sel" aria-label="Tab shown in the second view"></select>
        <span class="cmp-bar" id="cmpBar" hidden>
          <button class="mini" id="cmpPrev" title="Previous Difference" aria-label="Previous Difference">↑</button>
          <button class="mini" id="cmpNext" title="Next Difference" aria-label="Next Difference">↓</button>
          <span class="cmp-info" id="cmpInfo"></span>
          <button class="mini" id="cmpEnd">End Compare</button>
        </span>
        <span class="grow"></span>
        <label class="mini-check"><input type="checkbox" id="p2Sync" checked> Sync Scrolling</label>
        <button class="mini" id="p2Close" title="Close second view" aria-label="Close second view">×</button>
      </div>
      <div class="ed" id="editor2"></div>
    </section>
    <section class="pane" id="pane3" hidden aria-label="Markdown Preview">
      <div class="pane-head">
        <span>Markdown Preview</span>
        <span class="pane-name" id="mdName"></span>
        <span class="md-note" id="mdNote" hidden>(not an .md file, shown as Markdown anyway)</span>
        <span class="grow"></span>
        <label class="mini-check"><input type="checkbox" id="mdSync" checked> Sync Scrolling</label>
        <button class="mini" id="mdCopy" title="Copy the preview's HTML to the clipboard">Copy HTML</button>
        <button class="mini" id="mdExport" title="Download a standalone HTML file with styles">Export HTML</button>
        <button class="mini" id="mdClose" title="Close preview" aria-label="Close Markdown preview">×</button>
      </div>
      <div class="md-scroll" id="mdScroll"><article class="md-body" id="mdBody"></article></div>
    </section>
  </main>

  <section class="find" id="findPanel" hidden aria-label="Find and replace">
    <div class="find-row">
      <label class="field"><span>Find</span><input id="findInput" type="text" spellcheck="false" autocomplete="off"></label>
      <div class="seg" role="group" aria-label="Search mode">
        <button id="modeNormal" data-mode="normal" aria-pressed="true" title="Normal">General</button>
        <button id="modeExt" data-mode="ext" aria-pressed="false" title="Extended: \n \t \r \0 \xHH \uHHHH">Extended</button>
        <button id="modeRegex" data-mode="regex" aria-pressed="false" title="Regular expression (JavaScript syntax, ^ and $ match per line)">Regex</button>
      </div>
      <button class="chip" id="optCase" aria-pressed="false" translate="no" title="Match case">Aa</button>
      <button class="chip" id="optWord" aria-pressed="false" title="Match whole words only">Whole word</button>
      <button class="chip" id="optWrap" aria-pressed="true" title="Continue from the top after the end">Wrap</button>
      <button class="btn" id="btnPrev" title="Previous (⇧Enter)">↑ Previous</button>
      <button class="btn btn-primary" id="btnNext" title="Next (Enter)">↓ Next</button>
      <span class="find-info" id="findInfo" aria-live="polite"></span>
      <button class="find-close" id="findClose" title="Close (Esc)" aria-label="Close find panel">×</button>
    </div>
    <div class="find-row" id="listRow">
      <button class="btn" id="btnListCur" title="List every match in this document in the results panel below">List all</button>
      <button class="btn" id="btnListAll">List in all tabs</button>
      <button class="btn" id="btnMark" title="Keep every match marked in red">Mark all</button>
      <button class="chip" id="optBookmark" aria-pressed="false" title="Also bookmark matching lines when marking">Bookmark when marking</button>
      <button class="btn" id="btnClearMark">Clear marks</button>
    </div>
    <div class="find-row" id="replaceRow" hidden>
      <label class="field"><span>Replace with</span><input id="replInput" type="text" spellcheck="false" autocomplete="off" placeholder="Regex can use $1 or \1"></label>
      <button class="btn" id="btnReplace">Replace</button>
      <button class="btn" id="btnReplaceAll">Replace all</button>
      <button class="btn" id="btnReplaceAllTabs">Replace all in all tabs</button>
    </div>
    <div class="find-row" id="filesRow" hidden>
      <button class="btn" id="btnPickDir">Choose folder…</button>
      <span class="dir-label" id="dirLabel">No folder chosen</span>
      <label class="field"><span>Filter</span><input id="filterInput" type="text" spellcheck="false" autocomplete="off" placeholder="*.cs *.sql (empty means all files)"></label>
      <label class="check"><input type="checkbox" id="skipDirs" checked> Skip .git, node_modules, bin, obj and similar</label>
      <button class="btn btn-primary" id="btnFindInFiles">Find in files</button>
    </div>
  </section>

  <section class="results" id="results" hidden aria-label="Search results">
    <div class="res-grip" id="resGrip" title="Drag to resize"></div>
    <div class="res-head">
      <strong id="resTitle">Search results</strong>
      <span class="grow"></span>
      <button class="mini" id="resFold">Collapse All</button>
      <button class="mini" id="resClose" title="Close search results" aria-label="Close search results">×</button>
    </div>
    <div class="res-body" id="resBody"></div>
  </section>

  <footer class="status" id="status">
    <span id="stLen">Length 0</span>
    <span id="stLines">Lines 1</span>
    <span id="stPos">Ln 1, Col 1</span>
    <span id="stSel">Sel 0</span>
    <span class="st-rec" id="stRec" hidden>● Recording macro</span>
    <span class="grow"></span>
    <button class="st-btn" id="stEol" translate="no" title="Click to switch line endings">Unix (LF)</button>
    <button class="st-btn" id="stEnc" translate="no" title="Encoding options">UTF-8</button>
    <select id="stLang" aria-label="Language"></select>
    <span id="stIns" translate="no">INS</span>
  </footer>
</div>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-card">
    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>
<div class="drop" id="drop" hidden>Drop to open files</div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="fileInput" multiple hidden>
<input type="file" id="dirInput" webkitdirectory multiple hidden>
<input type="file" id="hexFileInput" multiple hidden>
